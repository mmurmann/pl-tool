<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mamu P&amp;L Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Lato:wght@400;700;900&family=Montserrat:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --olive:#77704a; --terra:#b18e72; --green:#455246; --char:#2e2c2d; --rule:#9b9599;
  --bg:#f5f5f5; --surface:#ffffff; --surface-2:#eeece8; --ink:#2e2c2d; --ink-2:#5b5859; --ink-3:#8c8789;
  --line:#e2dfda; --line-2:#c6c1c2; --accent:#455246; --accent-2:#b18e72; --num:#9a7659;
  --signal:#77704a; --signal-ink:#ffffff; --input:#ffffff; --focus:#b18e72;
  --good:#455246; --warn:#8a6a1c; --bad:#a8432f; --good-bg:#e4e9e4; --warn-bg:#f3ecd9; --bad-bg:#f4e2dc; --hl:#f1e8df;
  --key:#f0efe9;
  --display:"Lato","Segoe UI",Helvetica,Arial,sans-serif;
  --sub:"Montserrat","Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Montserrat","Segoe UI",Helvetica,Arial,sans-serif;
  --fig:"Futura","Futura PT","Jost","Century Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f1e1e; --surface:#2a2829; --surface-2:#343132; --ink:#f0eeeb; --ink-2:#c3bfbd; --ink-3:#8f8a8b;
    --line:#3c393a; --line-2:#5a5657; --accent:#a9b8aa; --accent-2:#c9a88d; --num:#d2b299;
    --signal:#77704a; --signal-ink:#ffffff; --input:#242223; --focus:#c9a88d;
    --good:#a9c2ab; --warn:#e0bd6a; --bad:#e8927c; --good-bg:#2c362d; --warn-bg:#3a3322; --bad-bg:#3e2823; --hl:#3a3128;
    --key:#322f2d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1e1e; --surface:#2a2829; --surface-2:#343132; --ink:#f0eeeb; --ink-2:#c3bfbd; --ink-3:#8f8a8b;
  --line:#3c393a; --line-2:#5a5657; --accent:#a9b8aa; --accent-2:#c9a88d; --num:#d2b299;
  --signal:#77704a; --signal-ink:#ffffff; --input:#242223; --focus:#c9a88d;
  --good:#a9c2ab; --warn:#e0bd6a; --bad:#e8927c; --good-bg:#2c362d; --warn-bg:#3a3322; --bad-bg:#3e2823; --hl:#3a3128;
  --key:#322f2d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;color:var(--ink);font-weight:700}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--signal);color:#fff;
  display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand svg{height:22px;width:auto;flex:none;fill:#fff}
.brand span{font-family:var(--sub);font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:18px;border-left:1px solid rgba(255,255,255,.4)}
.top .sp{flex:1}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:4px;padding:6px 11px;cursor:pointer;font-size:12.5px;letter-spacing:.02em}
.tbtn:hover{background:rgba(255,255,255,.12)}
.top .topseg{border-color:rgba(255,255,255,.45)}
.top .topseg button{background:transparent;color:#fff;padding:6px 11px;font-size:12.5px}
.top .topseg button.on{background:#fff;color:#2e2c2d}
.tbtn.solid{background:#fff;color:#2e2c2d;border-color:#fff;font-weight:700}
.tbtn.solid:hover{background:#fff}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:0;min-height:calc(100vh - 52px)}
.app.result-mode{grid-template-columns:230px minmax(0,1fr)}
.app.result-mode .live{display:none}
nav.steps{border-right:1px solid var(--line);padding:18px 0;background:var(--surface)}
nav.steps ol{list-style:none;margin:0;padding:0}
nav.steps li button{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;
  padding:8px 16px;cursor:pointer;color:var(--ink-2);font-size:13.5px;border-left:3px solid transparent}
nav.steps li button:hover{background:var(--surface-2);color:var(--ink)}
nav.steps li button .n{font-family:var(--fig);font-size:11px;font-weight:600;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink-2)}
nav.steps li button.on{color:var(--ink);font-weight:700;border-left-color:var(--accent-2);background:var(--surface-2)}
nav.steps li button.on .n{background:var(--green);border-color:var(--green);color:#fff}
nav.steps li.res{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
nav.steps li.res button .n{border-color:var(--accent-2);color:var(--accent-2)}
nav.steps .navnote{padding:14px 16px 0;font-size:12px;color:var(--ink-3)}

main{padding-block:26px 60px;padding-inline:32px;min-width:0}
.stephead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-family:var(--sub);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--num);font-weight:700}
.stephead h1{font-size:23px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.lead{color:var(--ink-2);max-width:72ch;margin:6px 0 22px}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:18px}
section.block>h2{font-family:var(--sub);font-size:14px;font-weight:700;margin-bottom:4px}
section.block>.hint{color:var(--ink-3);font-size:12.5px;margin:0 0 14px;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
label.f>span{display:flex;gap:6px;align-items:flex-end;flex:1}
.grid.row{grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}
.stack{display:flex;flex-direction:column}
.stack>.usali{margin-bottom:18px}
.occwrap{overflow-x:auto;margin-bottom:14px}
.occsvg{width:100%;max-width:760px;min-width:520px;height:auto;display:block;touch-action:none;user-select:none}
.occsvg .ocpt{cursor:ns-resize}
table.mocc td{vertical-align:top}
table.mocc tr.mfirst td{border-top:1px solid var(--line-2)}
table.mocc tr td{border-bottom:0}
table.mocc td input{min-width:46px;max-width:60px}
table.mocc td .pill{display:block;margin-top:3px;font-size:10px;padding:1px 4px;text-align:center}
.occsvg .s-L{fill:#9b9599}.occsvg .s-M{fill:#b18e72}.occsvg .s-H{fill:#455246}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.grid.row .inp em{padding:0 6px;font-size:11px}
.grid.row .inp input{padding:7px 6px}
.occsvg .ocpt:focus{outline:none;stroke-width:4}
@media (max-width:1100px){.grid.row{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.inp{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:4px;background:var(--input);overflow:hidden}
.inp:focus-within{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
.inp input,.inp select{border:0;background:transparent;padding:7px 9px;width:100%;min-width:0;outline:none;text-align:right}
.inp select,.inp input[type=text]{text-align:left}
.inp em{font-style:normal;color:var(--ink-3);font-size:12px;padding:0 9px;display:flex;align-items:center;background:var(--surface-2);border-left:1px solid var(--line);white-space:nowrap}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:var(--hl);box-shadow:0 0 0 3px var(--accent-2)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--accent-2)}}
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line-2);font-size:10px;color:var(--ink-3);cursor:help;flex:none}

/* tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-family:var(--sub);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t td input,table.t td select{width:100%;min-width:52px;max-width:110px;border:1px solid var(--line-2);border-radius:3px;background:var(--input);padding:5px 6px;text-align:right}
table.t td input[type=text],table.t td select{text-align:left;min-width:120px;max-width:none}
table.t td select.sm{min-width:0;width:auto}
table.t td input:focus,table.t td select:focus{outline:none;border-color:var(--focus)}
table.t tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
table.t td.muted{color:var(--ink-3)}
.xbtn{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:3px}
.xbtn:hover{color:var(--bad);background:var(--bad-bg)}
.addbtn{margin-top:10px;background:none;border:1px dashed var(--line-2);color:var(--ink-2);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12.5px}
table.t.stp tr.dh td{background:var(--soft,rgba(119,112,74,.07));font-family:var(--sub);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding-top:9px;padding-bottom:7px;border-bottom:1px solid var(--line-2)}
table.t.stp tr.dh td small{font-family:var(--body);font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);margin-left:8px;font-size:11px}
table.t.stp tr.dh.grp td{background:var(--olive);color:#fff;border-bottom:0}
table.t.stp tr.dh.grp td small{color:rgba(255,255,255,.8)}
table.t.stp tr.dh.dsub td{background:transparent;font-size:11px;color:var(--ink-2);padding-left:6px}
table.t.stp tr.dh.dsub td:first-child{padding-left:18px;border-left:3px solid var(--olive)}
table.t.stp tr.dh.tot td{background:transparent;border-top:2px solid var(--line-2);font-size:12px}
table.t.stp tr.auto td{color:var(--ink-2);font-style:italic}
table.t.stp tr.addr td{border-bottom:0;padding:0 6px 8px}
table.t.stp tr.empty td{font-size:12px}
table.t.stp td select.mv{width:92px;max-width:92px;font-size:11px;color:var(--ink-2);padding:4px 3px}
table.t.stp td input[type=text]{min-width:100px}
table.t.stp td select.sm{padding:4px 3px}
table.t.stp td,table.t.stp th{padding-left:3px;padding-right:3px}
table.t.stp td input[type=number]{max-width:64px}
table.t.stp td input[type=number]{min-width:44px}
.addbtn.sm{margin-top:4px;padding:3px 10px;font-size:11.5px}
.addbtn:hover{border-color:var(--accent);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--green)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:760px){.cal{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mon{border:1px solid var(--line);border-radius:5px;padding:8px 6px;background:var(--surface);display:flex;flex-direction:column;gap:5px;font-size:12px}
.mon b{font-family:var(--sub);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.mon select,.mon input{width:100%;border:1px solid var(--line-2);border-radius:3px;padding:4px;background:var(--input);font-size:12px}
.mon.closed{opacity:.55;background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}
.mon .sw{height:4px;border-radius:2px}
.mon .chk input{width:16px;flex:none}
.mon .calday{display:flex;align-items:center;gap:4px}
.mon .calday input{width:44px;flex:none}
.mon .calday span{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.mon .pill{font-size:10px;padding:1px 5px;text-align:center}
.s-L{background:#9b9599}.s-M{background:#b18e72}.s-H{background:#455246}

/* outlet cards */
.outlet{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px;background:var(--surface)}
.outlet-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.outlet-head .grow{flex:1;min-width:180px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--ink-3)}

/* module result */
.modres{border:1px solid var(--line-2);border-radius:6px;background:var(--surface-2);padding:14px 18px;margin-top:6px}
.modres h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 18px}
.kv div{display:flex;flex-direction:column}
.kv small{color:var(--ink-3);font-size:11.5px}
.kv strong{font-family:var(--fig);font-size:19px;font-weight:600;color:var(--num)}
.warnbox{margin-top:10px;padding:8px 12px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
.infobox{margin:0 0 14px;padding:9px 12px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;border-left:3px solid var(--accent-2)}

.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{filter:brightness(1.08)}

/* live panel */
.live{border-left:1px solid var(--line);background:var(--surface);padding:20px 18px}
.live-in{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.live h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.live .yr{font-size:12.5px;color:var(--ink-2);margin:2px 0 14px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);gap:8px}
.lrow span{color:var(--ink-2);font-size:12.5px}
.lrow b{font-family:var(--fig);font-weight:600;font-size:15px}
.lrow.big b{font-size:19px;color:var(--num)}
.lrow i{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-left:4px}
.delta{font-size:11px;font-weight:700;margin-left:4px}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}
.live .btn{width:100%;margin-top:16px}

/* ---------- result ---------- */
.res-toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:4px 0 18px}
.res-toolbar label.f{min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--char);color:#fff;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}
.kpi{background:var(--surface);padding:12px 14px}
.kpi small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sub);font-weight:600}
.kpi strong{display:block;font-family:var(--fig);font-size:24px;font-weight:600;margin-top:3px;color:var(--num)}
.kpi span{font-size:12px;color:var(--ink-2)}
.usali{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:22px}
.usali-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px 8px;border-bottom:1px solid var(--line-2)}
.usali-h h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.usali-h small{color:var(--ink-3)}
table.u{border-collapse:collapse;width:100%;font-size:12.5px}
table.u th{font-family:var(--sub);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 8px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.u th .ys{display:block;font-size:10px;letter-spacing:.02em;text-transform:none;font-weight:500}
table.u th:first-child{text-align:left}
table.u td{padding:4px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
table.u td:first-child{text-align:left;white-space:normal;min-width:210px}
table.u tr.sub td:first-child{padding-left:22px;color:var(--ink-2)}
table.u tr.sub td{color:var(--ink-2)}
table.u tr.sub2 td:first-child{padding-left:36px;color:var(--ink-3);font-size:12px}
table.u tr.sub2 td{color:var(--ink-3);font-size:12px}
table.u tr.hd td{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--num);padding-top:14px;border-bottom:0}
table.u tr.tot td{font-weight:700;border-top:1px solid var(--line-2)}
table.u tr.key td{font-weight:700;background:var(--key);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
table.u tr.key.gop td{border-top:2px solid var(--green)}
table.u td.dy,table.u th.dy{background:color-mix(in srgb,var(--terra) 12%,transparent)}
table.u td.pc{color:var(--ink-3);font-size:11.5px}
.pv{display:inline-block;min-width:2.9em;margin-left:6px;font-size:10px;font-weight:400;color:var(--ink-3);text-align:right;vertical-align:baseline}
.pvh{display:inline-block;min-width:2.9em;margin-left:6px;font-size:9px;text-align:right}
table.u tr.key .pv,table.u tr.tot .pv{font-weight:700}
table.u td.neg{color:var(--bad)}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;font:inherit;display:inline-flex;gap:6px;align-items:baseline}
.lnk::after{content:"\2197";font-size:10px;color:var(--accent-2);opacity:0;transition:opacity .15s}
.lnk:hover{color:var(--accent-2)}
.lnk:hover::after,.lnk:focus-visible::after{opacity:1}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
.note{font-size:12px;color:var(--ink-3);max-width:90ch}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:5px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--ink);border-radius:5px;padding:10px 14px;margin:0 0 16px}
.chart{width:100%;max-width:920px;height:auto;display:block}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:210px minmax(0,1fr)}
  .live{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}

/* ================= Rendering ================= */
function renderNav(){
  $('#stepList').innerHTML=STEPS.map(([k,l],i)=>`<li><button type="button" data-step="${k}" class="${k===step?'on':''}"><span class="n">${i+1}</span><span>${esc(l)}</span></button></li>`).join('')
   +`<li class="res"><button type="button" data-step="ergebnis" class="${step==='ergebnis'?'on':''}"><span class="n">∑</span><span>USALI Ergebnis</span></button></li>`;
}
function renderScenSeg(){const el=$('#scenSeg');if(el)el.innerHTML=SCEN.map(k=>`<button type="button" data-scen="${k}" class="${(S.scen||'Base')===k?'on':''}">${k}</button>`).join('')}
function renderStep(keepScroll){
  renderScenSeg(); ui.finC=null;
  const y=window.scrollY;
  $('#app').classList.toggle('result-mode',step==='ergebnis');
  if(step==='ergebnis'){renderResult();}
  else{
    const i=STEPS.findIndex(s=>s[0]===step), v=VIEWS[step]();
    const mr=MODRES[step]();
    $('#main').innerHTML=`<div class="stephead"><div><div class="eyebrow">Schritt ${i+1} von ${STEPS.length}</div><h1>${esc(v.t)}</h1></div></div>
      <p class="lead">${v.lead}</p>${v.html}
      ${mr?`<div class="modres" id="modresWrap"><h3>Modul-Ergebnis · stabilisiertes Jahr ${esc(yLabel(S.p.stab))}</h3><div id="modres">${mr}</div></div>`:''}
      <div class="stepnav">${i>0?`<button class="btn" type="button" data-step="${STEPS[i-1][0]}">← ${esc(STEPS[i-1][1])}</button>`:'<span></span>'}
      ${i<STEPS.length-1?`<button class="btn primary" type="button" data-step="${STEPS[i+1][0]}">Weiter: ${esc(STEPS[i+1][1])} →</button>`:`<button class="btn primary" type="button" data-step="ergebnis">Zum USALI-Ergebnis →</button>`}</div>`;
  }
  if(S.var==='bestand')$('#main').insertAdjacentHTML('afterbegin',varBanner());
  if(step==='projekt')setTimeout(seasLookup,50);
  renderNav(); renderLive();
  $('#projTitle').textContent=(S.p.name||'P&L Tool')+(S.var==='bestand'?' · Bestand':'');
  if(keepScroll)window.scrollTo(0,y);
}
function renderLive(){
  const R=stab(), P=ui.prev;

  $('#live').innerHTML=`<h3>Live-Ergebnis</h3>${S.var==='bestand'?'<p class="yr"><span class="pill warn">Bestand ohne Renovierung</span></p>':''}<p class="yr">Szenario <b>${esc(S.scen||'Base')}</b> · stabilisiertes Jahr ${yLabel(S.p.stab)} · ${R.cal}</p>

   <div class="lrow"><span>EBITDA ${d('ebitda')}</span><b>${e0(R.ebitda/1000)}<i>${pc(R.tr?R.ebitda/R.tr:0)}</i></b></div>

// Zeilen: [typ,label,fn(R),go,basis]  typ: hd,row,sub,tot,key,gop,stat

  return [
   ['hd','Operating Revenue'],
   ['row','Rooms',R=>R.roomsRev,G('preise','sec-rates'),'tr'],
   ['row','Food & Beverage',R=>R.fb.rev,G('fnb','sec-outlet-0'),'tr'],

   ['row','Other Operated Departments',R=>R.oodRev,G('ood','sec-ood'),'tr'],
   ['row','Miscellaneous Income',R=>R.misc,G('ood','sec-misc'),'tr'],
   ['tot','Total Operating Revenue',R=>R.tr,null,'tr'],
   ['hd','Departmental Expenses'],
   ['row','Rooms',R=>R.dRooms.exp,G('preise','sec-rexp'),'rooms'],

   ['row','Sales & Marketing',R=>R.uSm.tot,G('undist','sec-sm'),'tr'],

   ['gop','Gross Operating Profit',R=>R.gop,null,'tr'],

   ['row','Rent',R=>R.rent,G('nonop','sec-rent'),'tr'],
   ['row','Property & Other Taxes',R=>R.nTax,G('nonop','sec-nonop'),'tr'],
   ['row','Insurance',R=>R.nIns,G('nonop','sec-nonop'),'tr'],

function baseOf(R,b){return b==='rooms'?R.roomsRev:b==='fb'?R.fb.rev:b==='spa'?R.spa.rev:b==='ood'?R.oodRev:R.tr}
function lab(label,go){return go?`<button type="button" class="lnk" data-go="${go}" title="Zur Eingabe springen">${esc(label)}</button>`:esc(label)}

const pv=(v,b)=>`<span class="pv">${b?NF1.format(v/b*100):'–'}</span>`;
function schedule(title,revLabel,rev,rows,R){
  const por=v=>R.sold?e1(v/R.sold):'–';
  return `<div class="usali"><div class="usali-h"><h2>${esc(title)}</h2><small>${yLabel(ui.dy)} · ${R.cal} · ${ui.unit}</small></div><div class="tw"><table class="u"><thead><tr><th>Position</th><th>${ui.unit}<span class="pvh">% ${esc(revLabel)}</span></th><th>POR €</th></tr></thead><tbody>
   ${rows.map(([t,l,v,go])=>t==='hd'?`<tr class="hd"><td colspan="3">${esc(l)}</td></tr>`:
    `<tr class="${t}"><td>${lab(l,go)}</td><td class="${v<0?'neg':''}">${money(v)}${pv(v,rev)}</td><td class="pc">${por(v)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function scheduleData(R){
  const P=R.pay, lab2=(P)=>[['sub','Salaries & Wages',P.wages],['sub','Payroll-Related (inkl. Personalessen)',P.rel]];
  const rooms=[['hd','Revenue'],...R.seg.map(s=>['sub',`${s.name} · ${e0(s.rn)} RN · ADR ${e0(s.rn?s.rev/s.rn:0)} €`,s.rev,'preise|sec-segs']),['tot','Rooms Revenue',R.roomsRev],
    ['hd','Expenses'],['row','Labor Costs',R.dRooms.labor,'personal|sec-pos'],...lab2(P.Rooms),['sub','Contract Labor (Fremdreinigung)',P.Rooms.contract,'preise|sec-rexp'],...paySubs(S,R,'Rooms').map(d=>['sub2','davon '+d.label,d.P.total,'personal|sec-pos']),
    ['row','Commissions',R.dRooms.comm,'preise|sec-rexp'],['row','Reservations',R.dRooms.resv,'preise|sec-rexp'],['row','Guest Supplies',R.dRooms.supplies,'preise|sec-rexp'],['row','Laundry & Linen',R.dRooms.laundry,'preise|sec-rexp'],['row','Other Expenses',R.dRooms.other,'preise|sec-rexp'],
    ['tot','Total Expenses',R.dRooms.exp],['key','Rooms Departmental Profit',R.dRooms.profit]];
  const fb=[['hd','Revenue'],...R.outl.map((o,i)=>['sub',`${o.name} · ${e0(o.covers)} Covers`,o.food+o.bev,`fnb|sec-outlet-${i}`]),
    ['sub',`MICE-Pauschalen · ${e0(R.mice.full)} GT / ${e0(R.mice.half)} HT`,R.mice.rev,'mice|sec-mpk'],['sub','Bankette & Hochzeiten',R.mice.bq,'mice|sec-banq'],
    ['row','Food Revenue',R.fb.food],['row','Beverage Revenue',R.fb.bev],['row','Other Revenue (Minibar, Raum, IT, Misc)',R.fb.other,'mice|sec-mpk'],['tot','F&B Revenue',R.fb.rev],
    ['hd','Expenses'],['row','Cost of Food',R.dFb.cosF,'fnb|sec-fexp'],['row','Cost of Beverage',R.dFb.cosB,'fnb|sec-fexp'],['row','Cost of Other Revenue',R.dFb.cosO,'mice|sec-mpk'],
    ['row','Labor Costs',R.dFb.labor,'personal|sec-pos'],...lab2(P['F&B']),...paySubs(S,R,'F&B').map(d=>['sub2','davon '+d.label,d.P.total,'personal|sec-pos']),
    ['row','China, Glass, Silver, Linen',R.dFb.china,'fnb|sec-fexp'],['row','Operating Supplies',R.dFb.supplies,'fnb|sec-fexp'],['row','Laundry',R.dFb.laundry,'fnb|sec-fexp'],['row','Music & Entertainment',R.dFb.ent,'fnb|sec-fexp'],['row','Other Expenses',R.dFb.other,'fnb|sec-fexp'],
    ['tot','Total Expenses',R.dFb.exp],['key','F&B Departmental Profit',R.dFb.profit]];
  const X=R.spa;
  const spa=[['hd','Revenue'],['row',`Treatments · ${e0(X.t)} Behandl. · ${pc(X.util)} Auslastung`,X.treat,'spa|sec-sdem'],['row','Day Spa & Entrance',X.entr,'spa|sec-sday'],['row','Memberships',X.mem,'spa|sec-sday'],['row','Retail',X.retail,'spa|sec-sday'],['row','Other',X.other,'spa|sec-sday'],['tot','Spa Revenue',X.rev],
    ['hd','Expenses'],['row','Cost of Treatments (Produkte)',R.dSpa.cosT,'spa|sec-sexp'],['row','Cost of Retail',R.dSpa.cosR,'spa|sec-sexp'],
    ['row',`Labor Costs · ${e1(P.Spa.fte)} FTE`,R.dSpa.labor,'spa|sec-sther'],...lab2(P.Spa),['sub','Therapist Commissions',P.Spa.extra,'spa|sec-sther'],
    ['row','Linen & Laundry',R.dSpa.linen,'spa|sec-sexp'],['row','Operating Supplies',R.dSpa.supplies,'spa|sec-sexp'],['row','Other Expenses',R.dSpa.other,'spa|sec-sexp'],
    ['tot','Total Expenses',R.dSpa.exp],['key','Spa Departmental Profit',R.dSpa.profit]];
  const ood=[['hd','Revenue'],...R.ood.map(x=>['sub',x.name,x.rev,'ood|sec-ood']),['tot','OOD Revenue',R.oodRev],['hd','Expenses'],['row','Cost of Sales',R.dOod.cos,'ood|sec-ood'],['row','Labor Costs',R.dOod.labor,'personal|sec-pos'],['row','Other Expenses',R.dOod.other,'ood|sec-ood'],['tot','Total Expenses',R.dOod.exp],['key','OOD Departmental Profit',R.dOod.profit]];
  const und=[['hd','Administrative & General'],['sub','Labor Costs',R.uAg.labor,'personal|sec-pos'],['sub','Other Expenses',R.uAg.other,'undist|sec-ag'],['sub','Credit Card Commissions',R.uAg.cc,'undist|sec-ag'],['tot','Total A&G',R.uAg.tot],
    ['hd','Information & Telecommunication'],['sub','Labor Costs',R.uIt.labor,'personal|sec-pos'],['sub','Systems & Licences',R.uIt.other,'undist|sec-it'],['tot','Total IT',R.uIt.tot],
    ['hd','Sales & Marketing'],['sub','Labor Costs',R.uSm.labor,'personal|sec-pos'],['sub','Other Expenses',R.uSm.other,'undist|sec-sm'],['sub','Franchise & Affiliation Fees',R.uSm.fr,'undist|sec-sm'],['tot','Total S&M',R.uSm.tot],
    ['hd','Property Operation & Maintenance'],['sub','Labor Costs',R.uPom.labor,'personal|sec-pos'],['sub','Other Expenses',R.uPom.other,'undist|sec-pom'],['tot','Total POM',R.uPom.tot],
    ['hd','Utilities'],['sub','Grundlast BGF',R.uUt.base,'undist|sec-ut'],['sub','Spa-Zuschlag',R.uUt.spa,'undist|sec-ut'],['sub','Variabel je POR',R.uUt.var,'undist|sec-ut'],['tot','Total Utilities',R.uUt.tot],
    ['key','Total Undistributed',R.undist]];
  return {rooms,fb,spa,ood,und};
}

function renderResult(){
  if(ui.dy==null)ui.dy=+S.p.stab;
  const R=RES[ui.dy-1], rows=summaryRows();
  const head=`<tr><th>Position</th>${RES.map((r,i)=>`<th class="${i+1===ui.dy?'dy':''}">${yLabel(i+1)}<span class="ys">${r.cal}${i+1===+S.p.stab?' · stabil':''} · ${ui.unit} | %</span></th>`).join('')}<th class="dy">POR €<span class="ys">${yLabel(ui.dy)}</span></th></tr>`;
  const body=rows.map(([t,l,f,go,b])=>{
    if(t==='hd')return `<tr class="hd"><td colspan="${RES.length+2}">${esc(l)}</td></tr>`;
    if(t==='stat')return `<tr class="sub"><td>${lab(l,go)}</td>${RES.map((r,i)=>`<td class="${i+1===ui.dy?'dy':''}">${f(r)}<span class="pv"></span></td>`).join('')}<td class="dy"></td></tr>`;
    const cls=t==='gop'?'key gop':t==='row'?'':t;
    const v=f(R);
    return `<tr class="${cls}"><td>${lab(l,go)}</td>${RES.map((r,i)=>{const x=f(r);return `<td class="${i+1===ui.dy?'dy ':''}${x<-0.5?'neg':''}">${money(x)}${pv(x,baseOf(r,b))}</td>`}).join('')}<td class="dy pc">${R.sold?e1(v/R.sold):'–'}</td></tr>`;
  }).join('');
  const D=scheduleData(R);
  const pay=`<div class="usali"><div class="usali-h"><h2>Payroll & Staffing</h2><small>${yLabel(ui.dy)} · ${R.cal} · ${ui.unit}</small></div><div class="tw"><table class="u"><thead><tr><th>Abteilung</th><th>FTE Ø Saison</th><th>Wages</th><th>Related</th><th>Total<span class="pvh">% Revenue</span></th></tr></thead><tbody>
    ${DEPTS.map(([k,l])=>{const P=R.pay[k];return `<tr><td>${lab(l,'personal|sec-pos')}</td><td>${e1(P.fte)}</td><td>${money(P.wages)}</td><td>${money(P.rel+P.contract+P.extra)}</td><td>${money(P.total)}${pv(P.total,R.tr)}</td></tr>`+paySubs(S,R,k).map(d=>`<tr class="sub"><td>${lab(d.label,'personal|sec-pos')}</td><td>${e1(d.P.fte)}</td><td>${money(d.P.wages)}</td><td>${money(d.P.rel+d.P.extra)}</td><td>${money(d.P.total)}${pv(d.P.total,R.tr)}</td></tr>`).join('')}).join('')}
    <tr class="tot"><td>Total</td><td>${e1(R.fte)}</td><td>${money(sum(Object.values(R.pay).map(p=>p.wages)))}</td><td>${money(sum(Object.values(R.pay).map(p=>p.rel+p.contract+p.extra)))}</td><td>${money(R.payTotal)}${pv(R.payTotal,R.tr)}</td></tr></tbody></table></div></div>`;
  $('#main').innerHTML=`<div class="stephead"><div><div class="eyebrow">Ergebnis · USALI 11th Edition · Szenario ${esc(S.scen||'Base')}</div><h1>${esc(S.p.name)}</h1></div></div>
  <p class="lead">${esc(S.p.type)} · ${esc(S.p.cls)} · ${esc(S.p.location)} · ${e0(R.keys)} Keys · Eröffnung ${S.p.openYear} · Werte indexiert (Preisbasis ${S.p.baseYear}). Positionen anklicken, um zur Eingabe zu springen.</p>
  ${vatIssues(S).length?`<div class="warnbox noprint" style="margin-bottom:16px">MwSt.-Prüfung offen: ${esc(vatIssues(S).map(x=>x.msg).join(' · '))}. <button type="button" class="lnk" data-go="projekt|sec-vat"><b>Zur Prüfung</b></button></div>`:''}
  <div class="res-toolbar noprint">
    <div class="f"><span style="font-size:12.5px;color:var(--ink-2)">Einheit</span><div class="seg" role="group" aria-label="Einheit"><button type="button" data-unit="EUR" class="${ui.unit==='EUR'?'on':''}">EUR</button><button type="button" data-unit="T€" class="${ui.unit==='T€'?'on':''}">T€</button></div></div>
    <label class="f"><span>Detailjahr</span><div class="inp"><select id="dySel" aria-label="Detailjahr">${RES.map((r,i)=>`<option value="${i+1}"${i+1===ui.dy?' selected':''}>${yLabel(i+1)} · ${r.cal}${i+1===+S.p.stab?' (stabil)':''}</option>`).join('')}</select></div></label>
    <div class="f"><span style="font-size:12.5px;color:var(--ink-2)">Szenario</span><div class="seg" role="group" aria-label="Szenario">${SCEN.map(k=>`<button type="button" data-scen="${k}" class="${(S.scen||'Base')===k?'on':''}">${k}</button>`).join('')}</div></div>
    <button class="btn primary" type="button" id="btnPdf">PDF</button>
    <button class="btn" type="button" id="btnXlsF" title="Arbeitsmappe mit Excel-Formeln: Kostenannahmen und Treiber lassen sich in Excel ändern">Excel mit Formeln</button>
    <button class="btn" type="button" id="btnXlsV" title="Arbeitsmappe nur mit Werten">Excel nur Werte</button>
    <button class="btn" type="button" data-step="projekt">Zu den Eingaben</button>
  </div>
  <div class="kpis">
    ${[['Total Revenue',e0(R.tr/1000)+' T€',''],['Occupancy',pc(R.occ),e0(R.sold)+' RN'],['ADR',e0(R.adr)+' €','RevPAR '+e0(R.revpar)+' €'],['GOP',e0(R.gop/1000)+' T€',pc(R.tr?R.gop/R.tr:0)+' · GOPPAR '+e0(R.goppar)+' €'],['EBITDA',e0(R.ebitda/1000)+' T€',pc(R.tr?R.ebitda/R.tr:0)],['EBITDA n. Reserve',e0(R.ebitdaR/1000)+' T€',pc(R.tr?R.ebitdaR/R.tr:0)],['FTE',e1(R.fte),'Payroll '+pc(R.tr?R.payTotal/R.tr:0)],['Rent Cover',R.rent?e1(R.rentCover)+'×':'–',R.rent?'Pacht '+e0(R.rent/1000)+' T€':'keine Pacht']]
      .map(([a,b,c])=>`<div class="kpi"><small>${a}</small><strong>${b}</strong><span>${c}</span></div>`).join('')}
  </div>
  ${chartSvg()}
  ${scenCompare()}
  <div class="usali" id="usaliSummary"><div class="usali-h"><h2>Summary Operating Statement</h2><small>10-Jahres-Projektion · ${ui.unit} · % und POR für ${yLabel(ui.dy)}</small></div>
    <div class="tw"><table class="u"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>
  <h2 style="font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 12px">Departmental Schedules · ${yLabel(ui.dy)}</h2>
  <div class="stack">${schedule('Rooms','Rooms',R.roomsRev,D.rooms,R)}${schedule('Food & Beverage','F&B',R.fb.rev,D.fb,R)}${schedule('Spa','Spa',R.spa.rev,D.spa,R)}
   ${schedule('Other Operated Departments','OOD',R.oodRev,D.ood,R)}${schedule('Undistributed Operating Expenses','Revenue',R.tr,D.und,R)}</div>
  ${pay}
  ${finResultSection()}
  <p class="note">Gliederung nach Uniform System of Accounts for the Lodging Industry (USALI), 11. Ausgabe. Franchise- und Markengebühren unter Sales & Marketing, Kreditkartengebühren unter A&G, Personalessen als Payroll-Related Expense der jeweiligen Abteilung. Frühstücks- bzw. Halbpensionsanteil im Zimmerpreis wird als F&B-Umsatz ausgewiesen.</p>`;
}

function scenCompare(){
  const dy=ui.dy||+S.p.stab, rs=SCEN.map(k=>[k,computeYear(S,dy,k)]);
  const rows=[['Occupancy',R=>pc(R.occ)],['ADR (€)',R=>e0(R.adr)],['Total Revenue',R=>money(R.tr)],['GOP',R=>money(R.gop)],['GOP %',R=>pc(R.tr?R.gop/R.tr:0)],['EBITDA',R=>money(R.ebitda)],['EBITDA less Reserve',R=>money(R.ebitdaR)]];
  return `<div class="usali"><div class="usali-h"><h2>Szenario-Vergleich</h2><small>${yLabel(dy)} · ${RES[dy-1].cal} · ${ui.unit} · Parameter unter <button type="button" class="lnk" data-go="projektion|sec-scen">Projektion</button></small></div>
   <div class="tw"><table class="u"><thead><tr><th>Kennzahl</th>${rs.map(([k])=>`<th class="${k===(S.scen||'Base')?'dy':''}">${k}</th>`).join('')}</tr></thead><tbody>
   ${rows.map(([l,f])=>`<tr><td>${l}</td>${rs.map(([k,R])=>`<td class="${k===(S.scen||'Base')?'dy':''}">${f(R)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function chartSvg(){
  const W=900,H=190,pl=48,pr=12,pt=16,pb=30;
  const mx=Math.max(1,...RES.map(r=>r.tr));const mn=Math.min(0,...RES.map(r=>r.ebitdaR));
  const sc=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const bw=(W-pl-pr)/RES.length;
  const raw=mx/5,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw);
  let g='';for(let v=0;v<=mx;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${sc(v)}" y2="${sc(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${sc(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}).format(v/1e6)}${v?' Mio':''}</text>`}
  const bars=RES.map((r,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;return `<rect x="${x}" y="${sc(r.tr)}" width="${w}" height="${Math.max(0,sc(0)-sc(r.tr))}" fill="${i+1===ui.dy?'var(--terra)':'var(--surface-2)'}" stroke="var(--line-2)" stroke-width=".5"><title>${r.cal}: Umsatz ${e0(r.tr)} €</title></rect><text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${r.cal}</text>`}).join('');

function finIrr(cf){
  const npv=r=>cf.reduce((a,v,i)=>a+v/Math.pow(1+r,i),0);
  let lo=-0.95,hi=1.5,fl=npv(lo),fh=npv(hi);if(!isFinite(fl)||!isFinite(fh)||fl*fh>0)return null;
  for(let k=0;k<200;k++){const m=(lo+hi)/2,fm=npv(m);if(Math.abs(fm)<0.01)return m;if(fl*fm<0){hi=m;fh=fm}else{lo=m;fl=fm}}
  return (lo+hi)/2;
}
/* Jahreswerte eines Varianten-Ergebnisses nach Kalenderjahr, außerhalb der 10 Jahre mit Umsatzindex fortgeschrieben */
function serieOf(V,Rs,key){
  const g=1+(+V.idx.rev||0)/100, first=Rs[0].cal, last=Rs[Rs.length-1].cal;
  return cal=>{if(cal<first)return key(Rs[0])/Math.pow(g,first-cal);if(cal>last)return key(Rs[Rs.length-1])*Math.pow(g,cal-last);return key(Rs[cal-first])};
}
function finCompute(){
  const F=S.fin, plan=variantOf('neu'), own=F.struct!=='propco', reno=F.type==='reno';
  const warn=[];
  const Rp=plan===S?RES:computeAll(plan,S.scen);
  const kCF=own?(R=>R.ebitdaR+R.rent):(R=>R.rent);
  const planCF=serieOf(plan,Rp,kCF), planRev=serieOf(plan,Rp,R=>R.tr), opco=serieOf(plan,Rp,R=>R.ebitdaR);
  if(!own&&plan.n.rentMode==='none')warn.push(['Im Planfall ist keine Pacht hinterlegt. Für PropCo / OpCo bitte ein Pachtmodell festlegen.','nonop|sec-rent']);
  // Bestand
  let bestCF=()=>0, bestName='–', bestOk=true;
  if(reno){
    if(F.cmp==='A'){const I=F.ist,g=1+(+I.growth||0)/100;
      const base=own?(+I.ebitda||0)-(+I.rev||0)*(+I.res||0)/100:(+I.rent||0);
      bestCF=cal=>base*Math.pow(g,cal-(+I.year||cal));bestName='Ist-Zahlen '+I.year;
      if(!own&&!(+I.rent>0))warn.push(['Für PropCo / OpCo fehlt die bisherige Pacht (Ist).','finanz|sec-fcmp'])}
    else{const B=variantOf('bestand');
      if(!B){bestOk=false;warn.push([F.cmp==='B'?'Noch keine Bestandsvariante angelegt.':'Noch keine Projektdatei für den Bestand geladen.','finanz|sec-fcmp'])}
      else{const Rb=B===S?RES:computeAll(B,S.scen);bestCF=serieOf(B,Rb,kCF);bestName=F.cmp==='B'?'Bestandsvariante':'Datei '+(F.altName||'')}}
  }
  const cal0=(+plan.p.openYear)-1, H=clamp(Math.round(+F.horizon||20),5,40);
  // Investition
  const costs=sum(F.costs.map(c=>c.amt));
  const b0=reno?bestCF(cal0):0, bm=Math.max(0,+F.build||0), cl=reno?clamp(+F.closed||0,0,bm||+F.closed||0):0;
  const loss=reno?Math.max(0,b0)/12*(cl+Math.max(0,bm-cl)*clamp(+F.partLoss||0,0,100)/100)+(own?(+F.fixClosed||0)*cl:0):0;
  const N0=costs+loss, e=clamp(+F.ekPct||0,0,100)/100, r=(+F.rate||0)/100, t=bm/12;
  const den=1-(1-e)*r*t/2;
  const L=F.idc&&den>0?N0*(1-e)/den:N0*(1-e);
  const idc=F.idc?L*r*t/2:0, total=N0+idc, EK=total-L;
  // Kreditplan
  const term=Math.max(1,Math.round(+F.term||1));
  const free=F.mode==='free'?clamp(Math.round(+F.freeYears||0),0,term-1):0;
  const lin=F.mode==='lin'||(F.mode==='free'&&F.after==='lin');
  const sw=clamp(+F.sweep||0,0,100)/100, ex=+F.existDebt||0, dmin=+F.dscrMin||1.2;
  // Ertragsteuern: Abschreibung je Kostenposition, Bauzeitzinsen über die längste Dauer
  const T=F.tax||{}, taxOn=!!T.on;
  const afaL=F.costs.map(c=>({amt:+c.amt||0,n:Math.max(1,Math.round(+(c.afa!=null?c.afa:afaGuess(c.name))||1))}));
  const nMax=Math.max(1,...afaL.map(a=>a.n)); afaL.push({amt:idc,n:nMax});
  const afaOf=y=>sum(afaL.map(a=>y<=a.n?a.amt/a.n:0));
  let carry=0, taxSum=0;
  let bal=L,A=null,linP=null,cum=-EK,payback=null,paidOff=null;
  const rows=[{y:0,cal:cal0,bal:L,loss,idc,ek:EK}];
  const cfs=[-EK];
  for(let y=1;y<=H;y++){
    const cal=cal0+y, pc_=planCF(cal), bc=reno?bestCF(cal):0, mehr=pc_-bc;
    const int=bal*r; let pr=0;
    if(bal>0.5){
      if(y<=free)pr=0;
      else{
        if(A==null&&linP==null){const n=Math.max(1,term-free);if(lin)linP=bal/n;else A=r?bal*r/(1-Math.pow(1+r,-n)):bal/n}
        pr=lin?linP:A-int; if(y>=term)pr=bal; pr=clamp(pr,0,bal);
      }
    }
    const ds=int+pr;
    const afa=afaOf(y); let taxable=mehr-int-afa, tax=0;
    const RT=citRate(plan,cal,own?planRev(cal):pc_), tr=clamp(RT.rate,0,60)/100;
    if(taxOn){if(taxable<0){if(T.carry!==false)carry+=-taxable}else{const u=T.carry!==false?Math.min(carry,taxable):0;carry-=u;tax=(taxable-u)*tr}}
    taxSum+=tax;
    let surplus=mehr-ds-tax;
    const extra=bal-pr>0.5?Math.min(bal-pr,Math.max(0,surplus)*sw):0;
    surplus-=extra; bal=Math.max(0,bal-pr-extra);
    if(bal<0.5&&paidOff==null&&L>0)paidOff=y;
    const dscr=(ds+ex)>0.5?pc_/(ds+ex):null;
    const prev=cum; cum+=surplus;
    if(payback==null&&EK>0&&cum>=0&&surplus>0)payback=y-1+(-prev)/surplus;
    rows.push({y,cal,plan:pc_,best:bc,mehr,int,pr,extra,ds,dscr,surplus,afa,taxable,tax,carry,taxRate:RT.rate,taxTxt:RT.txt,cum:cum+EK,bal,opco:own?null:opco(cal),rev:planRev(cal),total:pc_-ds-extra-ex});
    cfs.push(surplus);
  }
  if(EK<=0)payback=0;
  const loanRows=rows.filter(x=>x.y>0&&x.ds>0.5);
  const dscrs=loanRows.map(x=>x.dscr).filter(v=>v!=null);
  const minD=dscrs.length?Math.min(...dscrs):null;
  const firstLow=loanRows.find(x=>x.dscr!=null&&x.dscr<dmin);
  const irr=EK>0?finIrr(cfs):null;
  const avgYield=EK>0?sum(rows.slice(1).map(x=>x.surplus))/H/EK:null;
  return {taxOn,taxSum,own,reno,H,cal0,costs,loss,b0,idc,total,EK,L,rows,minD,firstLow,dmin,payback,paidOff,irr,avgYield,warn,bestName,bestOk,free,lin,term,
    bal10:(rows[Math.min(10,H)]||{}).bal,planName:'Planfall'};
}

function finLights(F){
  const d=F.minD, dCls=d==null?'mute':d>=F.dmin?'good':d>=1?'warn':'bad';
  const dTxt=d==null?'kein Kredit':d>=F.dmin?'Bank ist gedeckt':d>=1?'knapp – unter Bankvorgabe':'Rate nicht gedeckt';
  const p=F.payback, pCls=p==null?'bad':p<=10?'good':p<=20?'warn':'bad';
  const pTxt=p==null?`nicht innerhalb von ${F.H} Jahren`:p<=10?'schnell':p<=20?'mittelfristig':'lang';
  if(!F.bestOk)return [['Reicht das Geld für die Bank?',d==null?'–':NF2.format(d)+'×',dCls,dTxt,'Deckung der Bankrate aus dem Cashflow des Planfalls.'],['Wann ist das Eigenkapital zurück?','–','mute','Bestand fehlt','Ohne Bestand lässt sich der Mehrertrag nicht berechnen.'],['Verzinsung des Eigenkapitals','–','mute','Bestand fehlt','Bitte zuerst den Bestand festlegen.']];
  const i=F.irr, iCls=i==null?'mute':i>=.08?'good':i>=.04?'warn':'bad';
  return [
    ['Reicht das Geld für die Bank?',d==null?'–':NF2.format(d)+'×',dCls,dTxt,`Kleinste Deckung der Bankrate im Kreditzeitraum (Cashflow ÷ Bankrate). Vorgabe ${NF2.format(F.dmin)}×.${F.firstLow?` Erstmals unterschritten ${F.firstLow.cal}.`:''}`],
    ['Wann ist das Eigenkapital zurück?',p==null?'> '+F.H+' J.':NF1.format(p)+' Jahre',pCls,pTxt,`Aus dem Mehrertrag nach Bankrate fließen ${e0(F.EK/1000)} T€ Eigenkapital zurück.`],
    ['Verzinsung des Eigenkapitals',i==null?'–':pc(i),iCls,i==null?'nicht ermittelbar':i>=.08?'attraktiv':i>=.04?'mäßig':'gering',`Jährliche Rendite (IRR) über ${F.H} Jahre, ${F.taxOn?'nach Ertragsteuern, ':''}ohne Verkaufs- oder Restwert, also vorsichtig gerechnet.`]
  ];
}
function finLightsHtml(F){

function finKv(F){

/* ---------- Diagramme ---------- */
function finCharts(F){
  const rs=F.rows.slice(1), n=rs.length;
  const W=520,H=230,pl=52,pr=14,pt=14,pb=28,bw=(W-pl-pr)/n;
  const tick=(mx)=>{const raw=Math.max(1,mx)/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw)};
  const fmtM=v=>Math.abs(v)>=1e6?new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}).format(v/1e6)+' Mio':e0(v/1000)+' T';
  const xLab=(i,r)=>(n<=12||(n-1-i)%Math.ceil(n/10)===0)?`<text x="${pl+i*bw+bw/2}" y="${H-9}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${r.cal}</text>`:'';
  // Chart 1: Mehrertrag (Balken) vs Bankrate (Linie)
  let mx=Math.max(1,...rs.map(r=>Math.max(r.mehr,r.ds+r.extra+r.tax))), mn=Math.min(0,...rs.map(r=>r.mehr));
  let st=tick(mx-mn); mx=Math.ceil(mx/st)*st; mn=Math.floor(mn/st)*st;
  let sc=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g='';for(let v=mn;v<=mx+1;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${sc(v)}" y2="${sc(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.2" stroke="var(--line-2)"':''}/><text x="${pl-6}" y="${sc(v)+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmtM(v)}</text>`;
  const bars=rs.map((r,i)=>{const x=pl+i*bw+bw*.2,w=Math.max(1,bw*.6),y0=sc(0),y1=sc(r.mehr);
    return `<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(.5,Math.abs(y1-y0))}" rx="2" fill="var(--olive)"><title>${r.cal}: Mehrertrag ${e0(r.mehr)} € · Bankrate ${e0(r.ds+r.extra+r.tax)} €</title></rect>${xLab(i,r)}`}).join('');
  const pts=rs.map((r,i)=>`${pl+i*bw+bw/2},${sc(r.ds+r.extra+r.tax)}`).join(' ');
  const dsl=`<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 3"/>`+rs.map((r,i)=>`<circle cx="${pl+i*bw+bw/2}" cy="${sc(r.ds+r.extra+r.tax)}" r="3" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.5"><title>${r.cal}: Bankrate ${e0(r.ds+r.extra+r.tax)} €</title></circle>`).join('');
  const c1=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mehrertrag und Bankrate je Jahr">${g}${bars}${dsl}</svg>`;
  // Chart 2: Restschuld vs Eigenkapital zurück
  mx=Math.max(1,F.L,F.EK,...rs.map(r=>r.cum)); mn=Math.min(0,...rs.map(r=>r.cum));
  st=tick(mx-mn); mx=Math.ceil(mx/st)*st; mn=Math.floor(mn/st)*st; sc=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  g='';for(let v=mn;v<=mx+1;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${sc(v)}" y2="${sc(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${sc(v)+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmtM(v)}</text>`;
  const xs=i=>pl+i*bw+bw/2;
  const lineOf=(k,c,lbl)=>`<polyline points="${rs.map((r,i)=>`${xs(i)},${sc(r[k])}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/>`+rs.map((r,i)=>`<circle cx="${xs(i)}" cy="${sc(r[k])}" r="${n>20?2.2:3}" fill="${c}" stroke="var(--surface)" stroke-width="1.2"><title>${r.cal}: ${lbl} ${e0(r[k])} €</title></circle>`).join('');
  const ekL=`<line x1="${pl}" x2="${W-pr}" y1="${sc(F.EK)}" y2="${sc(F.EK)}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><text x="${W-pr}" y="${sc(F.EK)-5}" text-anchor="end" font-size="10" fill="var(--ink-2)">Eigenkapital ${e0(F.EK/1000)} T€</text>`;
  const c2=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Restschuld und zurückgeflossenes Eigenkapital">${g}${ekL}${lineOf('bal','var(--accent)','Restschuld')}${lineOf('cum','var(--accent-2)','Eigenkapital zurück')}${rs.map((r,i)=>xLab(i,r)).join('')}</svg>`;
  return `<div class="fcharts">
   <div class="fchart"><h4>Mehrertrag und Bankrate${F.taxOn?' + Steuern':''} je Jahr</h4><div class="lg"><span><i class="sw bar"></i>Mehrertrag durch ${F.reno?'Renovierung':'das Projekt'}</span><span><i class="sw dash"></i>Bankrate (Zins + Tilgung)${F.taxOn?' + Steuern':''}</span></div>${c1}
     <p class="hint">Liegt der Balken über der Linie, bleibt nach der Bankrate${F.taxOn?' und den Steuern':''} Geld für die Eigentümer übrig.</p></div>
   <div class="fchart"><h4>Kredit und Eigenkapital über die Zeit</h4><div class="lg"><span><i class="sw" style="background:var(--accent)"></i>Restschuld Kredit</span><span><i class="sw" style="background:var(--accent-2)"></i>Eigenkapital zurück (kumuliert)</span></div>${c2}
     <p class="hint">Erreicht die rötliche Linie die gestrichelte Eigenkapital-Linie, ist das eingesetzte Geld zurück.</p></div></div>`;
}

function finTable(F,compact){
  const dpill=v=>v==null?'<span class="muted">–</span>':`<span class="pill ${v>=F.dmin?'good':v>=1?'warn':'bad'}">${NF2.format(v)}×</span>`;
  const rs=compact?F.rows.slice(0,Math.min(F.rows.length,16)):F.rows;
  const lblCF=F.own?'Cashflow':'Pacht';
  const r0=F.rows[0], nc=F.reno?9:8;
  return `<div class="tw"><table class="t ftab"><thead><tr><th>Jahr</th>
    <th title="${F.own?'EBITDA nach FF&E-Rücklage, vor Finanzierung':'Pachteinnahme der Eigentümergesellschaft'}">${lblCF}<br><span class="th2">Planfall</span></th>
    ${F.reno?`<th>${lblCF}<br><span class="th2">ohne Renov.</span></th>`:''}<th>Mehr-<br>ertrag</th>
    <th title="Zinsen + Tilgung inkl. Sondertilgung">Bankrate<br><span class="th2">Zins · Tilgung</span></th><th title="Deckung der Bankrate: Cashflow ÷ (Bankrate + bestehender Schuldendienst)">Deckung</th>
    ${F.taxOn?'<th title="Ertragsteuer auf den Mehrgewinn (Mehrertrag − Zinsen − Abschreibung)">Steuern<br><span class="th2">Satz</span></th>':''}<th title="Mehrertrag minus Bankrate${F.taxOn?' minus Steuern':''}">Über-<br>schuss</th><th>EK zurück<br><span class="th2">kumuliert</span></th><th>Rest-<br>schuld</th>
    ${F.own?'':'<th title="EBITDA der Betreibergesellschaft nach Pacht und Rücklage">OpCo<br><span class="th2">nach Pacht</span></th>'}</tr></thead><tbody>
    <tr class="y0"><td>${r0.cal}</td><td colspan="${F.reno?5:4}" style="text-align:left">Bau · Investition ${e0(F.total)} € · Eigenkapital ${e0(F.EK)} €${F.reno?` · Ertragsausfall ${e0(F.loss)} €`:''}</td>
      ${F.taxOn?'<td></td>':''}<td class="neg">−${e0(F.EK)}</td><td>0</td><td>${e0(F.L)}</td>${F.own?'':'<td></td>'}</tr>
    ${rs.slice(1).map(r=>`<tr${r.y===F.paidOff?' class="paid"':''}><td>${r.cal}</td><td>${e0(r.plan)}</td>${F.reno?`<td>${e0(r.best)}</td>`:''}<td class="${r.mehr<0?'neg':''}">${e0(r.mehr)}</td>
      <td><b>${e0(r.ds+r.extra)}</b><span class="sub2">${e0(r.int)} · ${e0(r.pr+r.extra)}${r.extra>0.5?' inkl. Sonder':''}</span></td><td>${dpill(r.dscr)}</td>
      ${F.taxOn?`<td>${e0(r.tax)}<span class="sub2">${NF1.format(r.taxRate)} %${r.carry>0.5?' · Vortrag '+e0(r.carry/1000)+' T':''}</span></td>`:''}<td class="${r.surplus<0?'neg':''}">${e0(r.surplus)}</td><td>${e0(r.cum)}${F.payback!=null&&r.cum>=F.EK&&r.cum-r.surplus<F.EK?'<span class="sub2"><span class="pill good">zurück</span></span>':''}</td><td>${e0(r.bal)}</td>
      ${F.own?'':`<td class="${r.opco<0?'neg':''}">${e0(r.opco)}</td>`}</tr>`).join('')}
  </tbody></table></div>${compact&&F.rows.length>16?`<p class="note">Erste 15 Betriebsjahre. Vollständige Tabelle im Schritt <button type="button" class="lnk" data-step="finanz"><b>Finanzierung</b></button>.</p>`:''}`;
}

function seasRegion(){

/* Online-Suche (OpenStreetMap Nominatim), nur wenn der Standort kein Stichwort trifft */
let seasBusy=false;
async function seasLookup(){
  const loc=(S.p.location||'').trim(); if(!loc||seasMatch(loc)||S.p.seasReg)return;
  if(S.p.seasGeo&&S.p.seasGeo.q===loc)return;
  seasBusy=true;seasRefresh();
  try{
    const cc={AT:'at',DE:'de',IT:'it',HR:'hr',CH:'ch',FR:'fr'}[S.p.country];
    const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&accept-language=de${cc?'&countrycodes='+cc:''}&q=${encodeURIComponent(loc)}`;
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(url,{signal:ctl.signal,headers:{'Accept':'application/json'}});const j=await r.json();
    const a=(j&&j[0]&&j[0].address)||{};
    const order=[a.county,a.province,a.state_district,a.region,a.state,j&&j[0]&&j[0].display_name];
    let code=null;for(const f of order){if(f){code=seasMatch(f);if(code)break}}
    S.p.seasGeo={q:loc,code,name:[a.state_district||a.county,a.state].filter(Boolean).join(', ')||(j[0]?j[0].display_name:'nicht gefunden')};
  }catch(e){S.p.seasGeo={q:loc,code:null,name:null,err:true}}
  seasBusy=false;saveLS();seasRefresh();
}

function seasChart(idx){

async function logoPng(){
  try{
    const paths=document.querySelector('.brand svg').innerHTML;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="805 346 1890 308" width="1134" height="185"><g fill="#ffffff">${paths}</g></svg>`;
    const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    await img.decode();
    const c=document.createElement('canvas');c.width=1134;c.height=185;c.getContext('2d').drawImage(img,0,0);

  }catch(e){return null}
}

   ['nInc','Income','row',c=>`${A('income')}*${T('pi',c)}`,R=>R.nIncome,'tr'],
   ['rFix','Info: Fixpacht','info',c=>`${A('rentKey')}*${T('keys',c)}*12*${T('ci',c)}`,R=>R.rentFix,'tr'],
   ['rVar','Info: Umsatzpacht','info',c=>`${T('roomsRev',c)}*${A('rentRooms')}+(${U('tr',c)}-${T('roomsRev',c)})*${A('rentOther')}`,R=>R.rentVar,'tr'],
   ['rent','Rent','row',c=>`IF(${A('rentMode')}="keine",0,IF(${A('rentMode')}="fix",${U('rFix',c)},IF(${A('rentMode')}="umsatz",${U('rVar',c)},MAX(${U('rFix',c)},${U('rVar',c)}))))`,R=>R.rent,'tr'],
   ['nTax','Property & Other Taxes','row',c=>`${U('tr',c)}*${A('tax')}`,R=>R.nTax,'tr'],['nIns','Insurance','row',c=>`${U('tr',c)}*${A('ins')}`,R=>R.nIns,'tr'],['nOth','Other','row',c=>`${U('tr',c)}*${A('nother')}`,R=>R.nOther,'tr'],
   ['nonop','Total Non-Operating Income & Expenses (net)','tot',c=>`${U('rent',c)}+${U('nTax',c)}+${U('nIns',c)}+${U('nOth',c)}-${U('nInc',c)}`,R=>R.nonop,'tr'],
   ['ebitda','EBITDA','key',c=>`${U('ibn',c)}-${U('nonop',c)}`,R=>R.ebitda,'tr'],
   ['res','Replacement Reserve','row',c=>`${U('tr',c)}*(${T('ffe',c)}+${A('bldg')})`,R=>R.reserve,'tr'],
   ['ebR','EBITDA less Replacement Reserve','key',c=>`${U('ebitda',c)}-${U('res',c)}`,R=>R.ebitdaR,'tr'],
   ['h5','Statistics','hd'],
   ['sKeys','Keys','sub',c=>T('keys',c),R=>R.keys,null,NUM],['sAv','Available Rooms','sub',c=>T('avail',c),R=>R.avail,null,NUM],['sSold','Rooms Sold','sub',c=>T('sold',c),R=>R.sold,null,NUM],
   ['sOcc','Occupancy','sub',c=>`IFERROR(${U('sSold',c)}/${U('sAv',c)},0)`,R=>R.occ,null,PCT],['sAdr','ADR (€)','sub',c=>T('adr',c),R=>R.adr,null,EUR2],
   ['sRevpar','RevPAR (€)','sub',c=>`IFERROR(${U('rRooms',c)}/${U('sAv',c)},0)`,R=>R.revpar,null,EUR2],['sTrev','TRevPAR (€)','sub',c=>`IFERROR(${U('tr',c)}/${U('sAv',c)},0)`,R=>R.trevpar,null,EUR2],
   ['sGoppar','GOPPAR (€)','sub',c=>`IFERROR(${U('gop',c)}/${U('sAv',c)},0)`,R=>R.goppar,null,EUR2],['sGopP','GOP in % Revenue','sub',c=>`IFERROR(${U('gop',c)}/${U('tr',c)},0)`,R=>R.tr?R.gop/R.tr:0,null,PCT],
   ['sEbP','EBITDA in % Revenue','sub',c=>`IFERROR(${U('ebitda',c)}/${U('tr',c)},0)`,R=>R.tr?R.ebitda/R.tr:0,null,PCT],['sFte','FTE (Ø Saison)','sub',c=>T('fte',c),R=>R.fte,null,EUR2]
  ];
  const rU={}; UR.forEach(([k],i)=>rU[k]=5+i);
  const baseV=(R,b)=>b==='tr'?R.tr:b==='rRooms'?R.roomsRev:b==='rFb'?R.fb.rev:b==='rSpa'?R.spa.rev:b==='rOod'?R.oodRev:R.tr;
  UR.forEach(([k,l,t,ff,g,b,fmt],i)=>{const row=wsU.getRow(5+i);row.getCell(1).value=t==='hd'?l.toUpperCase():l;
    if(t!=='hd'){
      RES.forEach((R,y)=>{const c=row.getCell(3+2*y);c.value=val(ff(UV(y)),g(R));c.numFmt=fmt||NUM;
        if(b){const v=g(R),bv=baseV(R,b),p=row.getCell(4+2*y);p.value=val(`IFERROR(${UV(y)}${5+i}/${UV(y)}${rU[b]}*100,0)`,bv?v/bv*100:0);p.numFmt='0.0'}});
      if(b){const v=g(Rd);const po=row.getCell(porCol);
        po.value=val(`IFERROR(${dyC}${5+i}/${dyC}${rU.sSold},0)`,Rd.sold?v/Rd.sold:0);po.numFmt=EUR2;}
    }
    styleRow(row,t,porCol);
    if(t!=='hd')RES.forEach((R,y)=>{const p=row.getCell(4+2*y);p.font={...PFONT,bold:t==='key'||t==='gop'||t==='tot'};p.alignment={horizontal:'right'}});
    if(t!=='hd'&&t!=='key'&&t!=='gop'){[3+2*(dyI-1),4+2*(dyI-1)].forEach(n=>{row.getCell(n).fill={type:'pattern',pattern:'solid',fgColor:{argb:DYF}}})}
  });
  wsU.columns=[{width:44},{width:2},...RES.flatMap(()=>[{width:12.5},{width:5.5}]),{width:10}];
  wsU.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0};

  /* ---------- Schedules (Werte, Detailjahr) ---------- */
  title(wsS,`Departmental Schedules · ${yLabel(dyI)} ${Rd.cal}`,`Szenario ${scen} · Werte in EUR · % der Abteilungsumsätze · POR = je verkauftem Zimmer`);
  const D=scheduleData(Rd); let r=4;
  [['Rooms',Rd.roomsRev,D.rooms],['Food & Beverage',Rd.fb.rev,D.fb],['Spa',Rd.spa.rev,D.spa],['Other Operated Departments',Rd.oodRev,D.ood],['Undistributed Operating Expenses',Rd.tr,D.und]].forEach(([tt,rev,rows])=>{
    headRow(wsS,r,[tt,'EUR','%','POR €']);r++;
    rows.forEach(([t,l,v])=>{const row=wsS.getRow(r);row.getCell(1).value=t==='hd'?l.toUpperCase():l;
      if(t!=='hd'){row.getCell(2).value=v;row.getCell(2).numFmt=NUM;row.getCell(3).value=rev?v/rev*100:0;row.getCell(3).numFmt='0.0';row.getCell(4).value=Rd.sold?v/Rd.sold:0;row.getCell(4).numFmt=EUR2}
      styleRow(row,t,4);if(t!=='hd'){row.getCell(3).font={...PFONT,bold:t==='key'||t==='tot'};row.getCell(3).alignment={horizontal:'right'}}r++});r++;});
  wsS.columns=[{width:52},{width:14},{width:6},{width:10}];

  /* ---------- Personal ---------- */
  title(wsP,`Payroll & Staffing · ${yLabel(dyI)} ${Rd.cal}`,`Szenario ${scen} · FY = Ganzjahreskraft, S = Saisonkraft`);
  headRow(wsP,4,['Abteilung','FTE Ø Saison','Wages','Related','Total','%']);r=5;
  DEPTS.forEach(([k,l])=>{const P=Rd.pay[k],row=wsP.getRow(r++);[l,P.fte,P.wages,P.rel+P.contract+P.extra,P.total,Rd.tr?P.total/Rd.tr*100:0].forEach((v,i)=>{const c=row.getCell(i+1);c.value=v;c.numFmt=i===1||i===5?'0.0':NUM});styleRow(row,'row',6);row.getCell(6).font=PFONT;paySubs(S,Rd,k).forEach(d=>{const K=d.P,row2=wsP.getRow(r++);[d.label,K.fte,K.wages,K.rel+K.extra,K.total,Rd.tr?K.total/Rd.tr*100:0].forEach((v,i)=>{const c=row2.getCell(i+1);c.value=v;c.numFmt=i===1||i===5?'0.0':NUM});styleRow(row2,'sub',6);row2.getCell(6).font=PFONT})});
  {const row=wsP.getRow(r++);['Total',Rd.fte,sum(Object.values(Rd.pay).map(p=>p.wages)),sum(Object.values(Rd.pay).map(p=>p.rel+p.contract+p.extra)),Rd.payTotal,Rd.tr?Rd.payTotal/Rd.tr*100:0].forEach((v,i)=>{const c=row.getCell(i+1);c.value=v;c.numFmt=i===1||i===5?'0.0':NUM});styleRow(row,'key',6);row.getCell(6).font={...PFONT,bold:true}}
  r++;headRow(wsP,r++,['Stellenplan','Abteilung','Früh','Mittel','Spät','Kopf = FTE','Brutto € / Monat (VZ)','FY / S','Stellenumfang']);
  deptList(S).forEach(d=>{const ps=S.st.pos.filter(p=>p.dept===d.key);if(!ps.length)return;const hr=wsP.getRow(r++);hr.getCell(1).value=((d.grp?d.grp+' · ':'')+d.label).toUpperCase();hr.getCell(2).value='USALI '+d.usali;styleRow(hr,'hd',9);
   ps.forEach(p=>{const row=wsP.getRow(r++);[p.pos,d.label,+p.e,+p.m,+p.l,p.hf?'ja':'nein',+p.sal,p.fs,(p.pct==null?100:+p.pct)+' %'].forEach((v,i)=>{row.getCell(i+1).value=v;if(i===6)row.getCell(i+1).numFmt=NUM});styleRow(row,'row',9)})});
  wsP.columns=[{width:34},{width:24},{width:12},{width:12},{width:12},{width:10},{width:20},{width:9},{width:13}];

  /* ---------- Szenarien ---------- */
  title(wsC,`Szenario-Vergleich · ${yLabel(dyI)} ${Rd.cal}`,'Abweichungen gegenüber Base gelten zusätzlich zum Hochlauf');
  headRow(wsC,4,['Kennzahl',...SCEN]);
  const rs=SCEN.map(k=>computeYear(S,dyI,k)); r=5;
  [['Belegung Δ pp',k=>k==='Base'?0:+S.sc[k].occ,'0.0'],['ADR Δ %',k=>k==='Base'?0:S.sc[k].adr/100,PCT],['Ext. Nachfrage Δ %',k=>k==='Base'?0:S.sc[k].ext/100,PCT],['Kosten Δ %',k=>k==='Base'?0:S.sc[k].cost/100,PCT]].forEach(([l,f,fm])=>{
    const row=wsC.getRow(r++);row.getCell(1).value=l;SCEN.forEach((k,i)=>{const c=row.getCell(2+i);c.value=f(k);c.numFmt=fm});styleRow(row,'sub',4)});
  r++;
  [['Occupancy',R=>R.occ,PCT],['ADR (€)',R=>R.adr,EUR2],['Total Revenue',R=>R.tr,NUM],['GOP',R=>R.gop,NUM],['GOP %',R=>R.tr?R.gop/R.tr:0,PCT],['EBITDA',R=>R.ebitda,NUM],['EBITDA less Reserve',R=>R.ebitdaR,NUM]].forEach(([l,f,fm])=>{
    const row=wsC.getRow(r++);row.getCell(1).value=l;rs.forEach((R,i)=>{const c=row.getCell(2+i);c.value=f(R);c.numFmt=fm});styleRow(row,'row',4)});
  wsC.columns=[{width:26},{width:14},{width:14},{width:14},{width:14},{width:12},{width:14}];


  /* ---------- Finanzierung ---------- */
  {const F=FIN(),fs=S.fin,own=F.own,reno=F.reno;
   title(wsF,'Finanzierung & Rückzahlung · '+S.p.name,`${reno?'Renovierung / Erweiterung, Vergleich mit '+F.bestName:'Neubau'} · ${own?'Eigentümer = Betreiber':'PropCo / OpCo'} · Szenario ${scen} · EUR`);
   const P=[['Gesamtinvestition',F.total],['davon Kosten',F.costs],['davon Ertragsausfall Bauphase',F.loss],['davon Bauzeitzinsen',F.idc],['Eigenkapital',F.EK],['Kredit',F.L],
     ['Zinssatz %',+fs.rate],['Laufzeit Jahre',+fs.term],['Rückzahlung',{ann:'Annuität',lin:'Linear',free:`${F.free} tilgungsfreie Jahre, danach ${fs.after==='lin'?'linear':'Annuität'}`}[fs.mode]],
     ['Bestehender Schuldendienst p.a.',+fs.existDebt||0]];
   P.forEach(([l,v],i)=>{const row=wsF.getRow(4+i);row.getCell(1).value=l;row.getCell(2).value=v;if(typeof v==='number')row.getCell(2).numFmt=i>=6&&i<=7?'0.0#':NUM;styleRow(row,'row',2)});
   const exRef='$B$13';
   const hdr=['Jahr',own?'Cashflow Planfall':'Pacht Planfall',reno?(own?'Cashflow Bestand':'Pacht Bestand'):'Bestand','Mehrertrag','Zinsen','Tilgung','Bankrate','Deckung (x)','Überschuss für Eigentümer','EK zurück kumuliert','Restschuld',...(own?[]:['OpCo nach Pacht']),...(F.taxOn?['Abschreibung','Steuersatz %','Ertragsteuern']:[])];
   const tc=own?12:13, TX=F.taxOn?String.fromCharCode(64+tc+2):null;
   headRow(wsF,16,hdr);
   const r0=wsF.getRow(17);[F.cal0,'Bau',null,null,null,null,null,null,-F.EK,0,F.L].forEach((v,i)=>{r0.getCell(i+1).value=v;if(typeof v==='number'&&i)r0.getCell(i+1).numFmt=NUM});styleRow(r0,'sub',hdr.length);
   F.rows.slice(1).forEach((r,k)=>{const n=18+k,row=wsF.getRow(n);
     const set=(c,f,v,fmt)=>{row.getCell(c).value=val(f,v);row.getCell(c).numFmt=fmt||NUM};
     row.getCell(1).value=r.cal;
     set(2,null,r.plan);set(3,null,r.best);set(4,`B${n}-C${n}`,r.mehr);set(5,null,r.int);set(6,null,r.pr+r.extra);set(7,`E${n}+F${n}`,r.ds+r.extra);
     set(8,`IF(G${n}+${exRef}>0,B${n}/(G${n}+${exRef}),"")`,r.dscr==null?'':r.dscr,'0.00');set(9,`D${n}-G${n}${TX?'-'+TX+n:''}`,r.surplus);set(10,`${k?'J'+(n-1):'0'}+I${n}`,r.cum);set(11,null,r.bal);
     if(!own)set(12,null,r.opco);
     if(F.taxOn){set(tc,null,r.afa);set(tc+1,null,r.taxRate,'0.0');set(tc+2,null,r.tax)}
     styleRow(row,'row',hdr.length)});
   wsF.columns=[{width:30},{width:16},{width:16},{width:14},{width:12},{width:12},{width:13},{width:11},{width:18},{width:18},{width:14},{width:14}];
   const nr=wsF.getRow(19+F.rows.length);nr.getCell(1).value='Zinsen und Tilgung aus dem Kreditplan des Tools. '+(F.taxOn?'Ertragsteuern auf den Mehrgewinn (Mehrertrag − Zinsen − Abschreibung) mit Verlustvortrag, Satz je Land und Jahr laut Tool.':'Ohne Ertragsteuern.')+' Ohne Verkaufs- oder Restwert. Jahre nach dem 10. Betriebsjahr mit Umsatzindex fortgeschrieben.';styleRow(nr,'info',1);
  }
  const buf=await wb.xlsx.writeBuffer();
  await saveFile(`${fileBase()}_PL_${scen}_${withF?'Formeln':'Werte'}.xlsx`,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
</script></body></html>
